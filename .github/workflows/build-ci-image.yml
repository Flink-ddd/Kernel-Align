name: Build CI Images

on:
  push:
    branches: [ main ]
    paths:
      - 'docker/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'requirements*.txt'
      - 'csrc/**'
      - '.github/workflows/build-ci-image.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docker/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'requirements*.txt'
      - 'csrc/**'
      - '.github/workflows/build-ci-image.yml'
  workflow_dispatch:

jobs:
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cuda
            dockerfile: docker/Dockerfile.cuda
            tag: cuda
          - backend: rocm
            dockerfile: docker/Dockerfile.rocm
            tag: rocm
    steps:
      - uses: actions/checkout@v4

      - name: Set lower case image name
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          echo "IMAGE=ghcr.io/$REPO/rl-kernel-ci" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: ${{ env.IMAGE }}:${{ matrix.tag }}
          cache-from: type=gha,scope=ci-image-${{ matrix.backend }}

  build-and-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cuda
            dockerfile: docker/Dockerfile.cuda
            tag: cuda
          - backend: rocm
            dockerfile: docker/Dockerfile.rocm
            tag: rocm
    steps:
      - uses: actions/checkout@v4

      - name: Set lower case image name
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          echo "IMAGE=ghcr.io/$REPO/rl-kernel-ci" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.tag }}
          cache-from: type=gha,scope=ci-image-${{ matrix.backend }}
          cache-to: type=gha,mode=max,scope=ci-image-${{ matrix.backend }}
